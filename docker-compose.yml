# Prod: docker compose up -d --build
# Hamma port faqat 127.0.0.1 da — tashqariga host nginx chiqaradi.
name: fazo-club
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fazo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: fazo_club
    ports:
      - '127.0.0.1:${PG_PORT:-4602}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fazo -d fazo_club']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://fazo:${POSTGRES_PASSWORD}@postgres:5432/fazo_club
      PORT: 4600
      TZ: Asia/Tashkent
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-4600}:4600'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4600/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_BOT_USERNAME: ${BOT_USERNAME:-FazoClub_bot}
    restart: unless-stopped
    environment:
      API_URL: http://api:4600
    depends_on:
      - api
    ports:
      - '127.0.0.1:${WEB_PORT:-4601}:4601'

volumes:
  pgdata:
