# /etc/nginx/sites-available/fazo-club  →  sites-enabled/fazo-club
# Fazo Group (“KIA SONET MENIKI” aksiyasi). Ikki subdomen, bitta web + api:
#   promo.fazorestaurant.uz — mijozlar: mini app, qoidalar, Telegram webhook (PUBLIC_URL)
#   panel.fazorestaurant.uz — admin panel (kassir, admin)
# HTTPS'ni certbot qo'shadi:
#   sudo certbot --nginx -d promo.fazorestaurant.uz -d panel.fazorestaurant.uz
# Konteynerlar faqat 127.0.0.1 da: api 4600, web 4601 (docker-compose.yml).

# ── Mijozlar ────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name promo.fazorestaurant.uz;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Admin panel bu yerda ochilmaydi
    location /admin {
        return 301 https://panel.fazorestaurant.uz$request_uri;
    }
    location /api/admin/ {
        return 404;
    }

    # API (mini app) va Telegram webhook (/api/tg/webhook)
    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:4601;
    }
}

# ── Admin panel ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name panel.fazorestaurant.uz;

    # Chek logosi yuklash (rasm)
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 302 /admin;
    }
    # Mijozlar sahifalari va bot webhook'i — promo'da
    location ~ ^/(miniapp|rules)(/|$) {
        return 301 https://promo.fazorestaurant.uz$request_uri;
    }
    location /api/tg/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:4601;
    }
}
