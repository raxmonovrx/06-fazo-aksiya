# /etc/nginx/sites-available/fazo-club  →  sites-enabled/fazo-club
# Fazo Group (“KIA SONET MENIKI” aksiyasi): mini app, admin panel, API, Telegram webhook.
# HTTPS'ni certbot qo'shadi:  sudo certbot --nginx -d club.fazorestaurant.uz
# Konteynerlar faqat 127.0.0.1 da: api 4600, web 4601 (docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name club.fazorestaurant.uz;

    # Chek logosi yuklash (rasm)
    client_max_body_size 30m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API va Telegram webhook (/api/tg/webhook)
    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:4601;
    }
}
