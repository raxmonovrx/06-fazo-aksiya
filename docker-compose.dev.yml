# Lokal ishlab chiqish: faqat Postgres. API va web `pnpm dev:*` bilan.
name: fazo-club-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fazo
      POSTGRES_PASSWORD: fazo
      POSTGRES_DB: fazo_club
    ports:
      - '127.0.0.1:4602:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
